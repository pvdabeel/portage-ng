name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  plunit:
    name: PLUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 26 ships SWI-Prolog 9.2.9. This project requires SWI 10.
      - name: Install SWI-Prolog
        run: |
          set +e
          bash .github/scripts/install-swipl.sh > "$RUNNER_TEMP/swi-install.log" 2>&1
          code=$?
          if [ "$code" != 0 ]; then
            {
              echo "install_exit=$code"
              grep -E '^(OS |Installing |From |No SWI|E:|Err:|W: )' "$RUNNER_TEMP/swi-install.log" || true
            } | head -n 25 | while IFS= read -r line; do
              line=${line//%/%25}
              line=${line//$'\r'/%0D}
              echo "::error title=SWI install::$line"
            done
            exit "$code"
          fi

      - name: Create private config files from templates
        run: |
          cp Source/Config/Private/template_api_key.pl Source/Config/Private/api_key.pl
          cp Source/Config/Private/template_passwords.pl Source/Config/Private/passwords.pl

      - name: Run PLUnit tests
        run: |
          set +e
          swipl -O --stack-limit=4G \
            -f portage-ng.pl \
            -p portage=. \
            -Dverbose_autoload=false \
            -g "
              load_modules(common),
              load_modules(standalone),
              load_files(portage('Source/Test/unittest'), [if(true)]),
              (run_tests -> halt(0) ; halt(1))
            " -t 'halt(2)' > "$RUNNER_TEMP/plunit.log" 2>&1
          code=$?
          set -e
          if [ "$code" != 0 ]; then
            CODE="$code" python3 - << 'PY'
          import os, pathlib
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "plunit.log"
          text = log.read_text(errors="replace") if log.exists() else ""
          picked = [ln for ln in text.splitlines()
                    if "ERROR:" in ln or "FAILED" in ln or "test failed" in ln
                    or "tests passed" in ln]
          if not picked:
              picked = text.splitlines()[-40:]
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          ver = os.popen("swipl --version").read().strip()
          print("::error::" + esc(ver + " exit " + os.environ.get("CODE", "?")))
          for ln in picked[:40]:
              print("::error::" + esc(ln))
          PY
            exit "$code"
          fi

  overlay:
    name: Overlay regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu 26 ships SWI-Prolog 9.2.9. This project requires SWI 10.
      - name: Install SWI-Prolog
        run: |
          set +e
          bash .github/scripts/install-swipl.sh > "$RUNNER_TEMP/swi-install.log" 2>&1
          code=$?
          if [ "$code" != 0 ]; then
            {
              echo "install_exit=$code"
              grep -E '^(OS |Installing |From |No SWI|E:|Err:|W: )' "$RUNNER_TEMP/swi-install.log" || true
            } | head -n 25 | while IFS= read -r line; do
              line=${line//%/%25}
              line=${line//$'\r'/%0D}
              echo "::error title=SWI install::$line"
            done
            exit "$code"
          fi

      - name: Create private config files from templates
        run: |
          cp Source/Config/Private/template_api_key.pl Source/Config/Private/api_key.pl
          cp Source/Config/Private/template_passwords.pl Source/Config/Private/passwords.pl

      # Runs the 80-scenario end-to-end suite (prover+planner+scheduler+
      # printer) against the in-repo synthetic overlay (Repository/Overlay).
      # test:ensure_overlay registers the overlay repo-relative; no host- or
      # CI-specific repository configuration is involved.
      - name: Run overlay regression suite
        run: |
          ./Source/Application/Wrapper/portage-ng-dev --mode standalone --shell --timeout 900 <<'PL'
          loader:load_test_modules.
          ( catch(test:run(cases,batch),E,(print_message(error,E),fail)) -> halt(0) ; halt(1) ).
          PL

      - name: Upload per-case outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-test-outputs
          path: Source/Tests/
